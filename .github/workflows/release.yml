name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: if ($env:RELEASE_TAG -notmatch '^v[0-9][A-Za-z0-9._-]*$') { throw 'Expected an existing v* tag' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Detector.slnx
      - run: dotnet test Detector.slnx -c Release --no-restore
      - name: Publish Windows applications
        shell: pwsh
        run: |
          dotnet publish src/Detector/Detector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/cli
          dotnet publish src/Detector.Gui/Detector.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/gui
          Compress-Archive -Path artifacts/cli/* -DestinationPath artifacts/detector-cli-win-x64.zip
          Compress-Archive -Path artifacts/gui/* -DestinationPath artifacts/detector-gui-win-x64.zip
          Get-FileHash artifacts/*.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$env:RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "Detector $env:RELEASE_TAG"
